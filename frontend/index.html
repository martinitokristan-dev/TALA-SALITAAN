    <title>Tala-Salitaan</title>
    <script>
      // Installed app (home-screen icon): show the launch splash below until the first screen is ready.
      (function () {
        try {
          var app =
            matchMedia('(display-mode: standalone)').matches ||
            matchMedia('(display-mode: fullscreen)').matches ||
            navigator.standalone === true
          if (app) document.documentElement.classList.add('is-app')
        } catch (e) {}
        var done = false
        // Called by the app once the first screen is drawn (src/App.tsx). Keeps the splash at least
        // ~1.1 s (0.3 s with reduced motion) and until the pixel fonts are in, then fades it out.
        window.__talaLaunchReady = function () {
          if (done) return
          done = true
          var el = document.getElementById('launch')
          if (!el) return
          if (!document.documentElement.classList.contains('is-app')) return el.remove()
          var calm = false
          try { calm = matchMedia('(prefers-reduced-motion: reduce)').matches } catch (e) {}
          var minMs = calm ? 300 : 1100
          var fonts = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()
          var capped = Promise.race([fonts, new Promise(function (r) { setTimeout(r, 1500) })])
          capped.then(function () {
            setTimeout(function () {
              el.classList.add('is-out')
              setTimeout(function () { el.remove() }, 420)
            }, Math.max(0, minMs - performance.now()))
          })
        }
        // Never cover the app for long, even if the first screen is slow.
        setTimeout(function () { if (window.__talaLaunchReady) window.__talaLaunchReady() }, 8000)
      })()
    </script>
    <style>
      /* Launch splash (installed app only). transform/opacity only, so it runs on the GPU at 60 fps. */
      #launch { display: none; }
      .is-app #launch {
        position: fixed; inset: 0; z-index: 10000;
        display: flex; align-items: center; justify-content: center;
        overflow: hidden; pointer-events: none;
        background: #5aa9ee radial-gradient(circle at 50% 46%, #8fd3f7 0, #6fb8f1 32%, #5aa9ee 68%);
        transition: opacity 0.38s ease;
      }
      #launch .l-box { position: relative; width: min(46vmin, 260px); aspect-ratio: 1; }
      #launch .l-rays {
        position: absolute; inset: -80%;
        background: repeating-conic-gradient(from 0deg, rgba(255, 255, 255, 0.24) 0deg 8deg, transparent 8deg 24deg);
        -webkit-mask: radial-gradient(circle, #000 14%, transparent 60%);
        mask: radial-gradient(circle, #000 14%, transparent 60%);
        opacity: 0;
        animation: l-fade 0.6s ease-out 0.15s forwards, l-spin 14s linear infinite;
      }
      #launch .l-glow {
        position: absolute; inset: -30%; border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 246, 200, 0.95) 0, rgba(255, 230, 128, 0.45) 35%, rgba(255, 230, 128, 0) 68%);
        opacity: 0; transform: scale(0.6);
        animation: l-glow 1.1s ease-out 0.2s forwards;
      }
      #launch .l-star {
        position: relative; display: block; width: 100%; height: 100%;
        opacity: 0; transform: scale(0.35) rotate(-14deg);
        animation: l-pop 0.62s cubic-bezier(0.2, 1.6, 0.4, 1) 0.05s forwards, l-bob 1.6s ease-in-out 0.7s infinite;
      }
      #launch .l-spark { position: absolute; width: 15%; opacity: 0; transform: scale(0); }
      #launch .l-spark.a { right: -8%; top: -4%; animation: l-twinkle 0.9s ease-out 0.55s forwards; }
      #launch .l-spark.b { left: -12%; top: 52%; width: 11%; animation: l-twinkle 0.9s ease-out 0.7s forwards; }
      #launch .l-spark.c { right: 4%; bottom: -8%; width: 9%; animation: l-twinkle 0.9s ease-out 0.85s forwards; }
      #launch.is-out { opacity: 0; }
      #launch.is-out .l-box { transform: scale(1.12); transition: transform 0.38s ease-in; }
      @keyframes l-pop { to { opacity: 1; transform: scale(1) rotate(0deg); } }
      @keyframes l-bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -3%; } }
      @keyframes l-glow { 0% { opacity: 0; transform: scale(0.6); } 55% { opacity: 1; transform: scale(1.08); } 100% { opacity: 0.8; transform: scale(1); } }
      @keyframes l-fade { to { opacity: 1; } }
      @keyframes l-spin { to { transform: rotate(360deg); } }
      @keyframes l-twinkle { 0% { opacity: 0; transform: scale(0) rotate(-45deg); } 60% { opacity: 1; transform: scale(1.2) rotate(0deg); } 100% { opacity: 0.9; transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) {
        #launch .l-rays, #launch .l-glow, #launch .l-star, #launch .l-spark { animation: none; opacity: 1; transform: none; }
        #launch .l-rays { opacity: 0.6; }
        #launch.is-out .l-box { transform: none; }
      }
    </style>
